# ModSecurity 커스텀 예외 규칙 (의도적 허점)
# 배치: /etc/modsecurity/custom-exclusions.conf
#
# 목적: "WAF가 있지만 설정 미흡" → SQLi 통과 → 개선 권고라는 현실적 시나리오

# =====================================================
# SQLi 탐지 (942xxx): DetectionOnly — 로그만, 차단 안 함
# =====================================================
# 이유: WAF 도입 초기에 오탐 우려로 탐지만 하는 실무 시나리오
SecRuleUpdateActionById 942100 "pass,log,auditlog"
SecRuleUpdateActionById 942110 "pass,log,auditlog"
SecRuleUpdateActionById 942120 "pass,log,auditlog"
SecRuleUpdateActionById 942130 "pass,log,auditlog"
SecRuleUpdateActionById 942140 "pass,log,auditlog"
SecRuleUpdateActionById 942150 "pass,log,auditlog"
SecRuleUpdateActionById 942160 "pass,log,auditlog"
SecRuleUpdateActionById 942170 "pass,log,auditlog"
SecRuleUpdateActionById 942180 "pass,log,auditlog"
SecRuleUpdateActionById 942190 "pass,log,auditlog"
SecRuleUpdateActionById 942200 "pass,log,auditlog"
SecRuleUpdateActionById 942210 "pass,log,auditlog"
SecRuleUpdateActionById 942220 "pass,log,auditlog"
SecRuleUpdateActionById 942230 "pass,log,auditlog"
SecRuleUpdateActionById 942240 "pass,log,auditlog"
SecRuleUpdateActionById 942250 "pass,log,auditlog"
SecRuleUpdateActionById 942260 "pass,log,auditlog"
SecRuleUpdateActionById 942270 "pass,log,auditlog"
SecRuleUpdateActionById 942280 "pass,log,auditlog"
SecRuleUpdateActionById 942290 "pass,log,auditlog"
SecRuleUpdateActionById 942300 "pass,log,auditlog"
SecRuleUpdateActionById 942310 "pass,log,auditlog"
SecRuleUpdateActionById 942320 "pass,log,auditlog"
SecRuleUpdateActionById 942330 "pass,log,auditlog"
SecRuleUpdateActionById 942340 "pass,log,auditlog"
SecRuleUpdateActionById 942350 "pass,log,auditlog"
SecRuleUpdateActionById 942360 "pass,log,auditlog"
SecRuleUpdateActionById 942370 "pass,log,auditlog"
SecRuleUpdateActionById 942380 "pass,log,auditlog"

# =====================================================
# Scanner 탐지 (913xxx): DetectionOnly — wpscan 로그만
# =====================================================
SecRuleUpdateActionById 913100 "pass,log,auditlog"
SecRuleUpdateActionById 913110 "pass,log,auditlog"
SecRuleUpdateActionById 913120 "pass,log,auditlog"

# =====================================================
# File Upload (930xxx): .php만 차단, .phtml 우회 가능
# =====================================================
# 기본 CRS 930xxx는 활성화 (On), 하지만 .phtml 확장자 예외 추가
SecRule REQUEST_FILENAME "@endsWith .phtml" \
    "id:999001,phase:2,pass,nolog,\
    ctl:ruleRemoveById=930120"

# =====================================================
# XSS 탐지 (941xxx): On (차단) — 정상 동작
# RCE 탐지 (932xxx): On (차단) — 정상 동작
# =====================================================
# 별도 예외 없음 — 기본 CRS 룰 그대로 적용
