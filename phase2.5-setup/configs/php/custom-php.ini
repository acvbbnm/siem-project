; PHP 설정 (의도적 취약점 포함)
; 배치: /etc/php/8.1/apache2/conf.d/99-custom.ini

; === 의도적 취약점: 에러 출력 (DB 정보 노출) ===
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; === 의도적 취약점: open_basedir 미설정 (파일 시스템 전체 접근) ===
; open_basedir =

; === 의도적 취약점: 위험 함수 미차단 ===
; disable_functions =

; 파일 업로드 (웹쉘 업로드 가능한 크기)
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 20

; === 정상 설정: RFI 차단 ===
allow_url_include = Off
allow_url_fopen = On

; 세션 설정
session.cookie_httponly = 1
; === 의도적 취약점: secure 플래그 미설정 (HTTP 환경) ===
session.cookie_secure = 0

; 최대 실행 시간 (SQLi 슬로우 쿼리 허용)
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
