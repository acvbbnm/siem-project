# Apache 보안 설정 (의도적 취약점 포함)
# 배치: /etc/apache2/conf-available/security.conf
# 활성화: a2enconf security

# === 의도적 취약점: 서버 버전 전체 노출 ===
ServerTokens Full
ServerSignature On

# 디렉토리 리스팅 기본 비활성화 (특정 디렉토리만 활성화)
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
</Directory>

# === 의도적 취약점: 보안 헤더 미설정 ===
# X-Frame-Options 미설정 → 클릭재킹 가능
# X-Content-Type-Options 미설정
# Content-Security-Policy 미설정

# ETag 정보 노출 제한 (inode 제거)
FileETag MTime Size
