<VirtualHost *:80>
    ServerName techsolution.local
    ServerAlias 10.0.10.80
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # === 의도적 취약점: 디렉토리 리스팅 (uploads) ===
    <Directory /var/www/html/wp-content/uploads>
        Options +Indexes
    </Directory>

    # 로그 설정 (Splunk 연동)
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # === 의도적 취약점: TRACE 메서드 허용 ===
    TraceEnable On
</VirtualHost>
