name: Claude Code

# 이슈/PR 코멘트나 리뷰에서 "@claude ..." 로 멘션하면 클라우드에서 Claude가 동작한다.
# (예: 스마트폰 GitHub 앱 → 이슈 열기 → "@claude phase1 R-1 결과 정리해서 PR 올려줘")
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # 실제로 @claude 가 멘션된 경우에만 실행 (불필요한 과금 방지)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 코드 수정/커밋
      pull-requests: write   # PR 생성/코멘트
      issues: write          # 이슈 코멘트
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Claude Pro/Max 구독으로 인증 (종량제 API 과금 없음).
          # 토큰 생성: 로컬에서 `claude setup-token` 실행 → 나온 토큰을
          # GitHub 저장소 Settings > Secrets and variables > Actions 에
          # CLAUDE_CODE_OAUTH_TOKEN 이름으로 등록.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
